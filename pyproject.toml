[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:SetupBackend"

[project]
name = "redmi-forge"
version = "0.1.0"
description = "Módulos Python headless (OTA watch, mantenimiento, auditoría de apps) para el toolkit CLI Redmi 14C — sin interfaz"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "plyer>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]
