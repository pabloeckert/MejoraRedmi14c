[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:SetupBackend"

[project]
name = "redmi-forge"
version = "0.1.0"
description = "Servicios de soporte para Redmi 14C (OTA watcher, debloat engine) — Windows 11"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "plyer>=2.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]
